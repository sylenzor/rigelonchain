<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="eyeL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00FFA3"/>
      <stop offset=".55" stop-color="#03E1FF"/>
      <stop offset="1" stop-color="#2E9BFF"/>
    </linearGradient>
    <linearGradient id="eyeR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E9BFF"/>
      <stop offset=".5" stop-color="#7A5CFF"/>
      <stop offset="1" stop-color="#DC1FFF"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#03E1FF"/>
      <stop offset="1" stop-color="#DC1FFF"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- eye glow layer -->
  <g filter="url(#soft)" opacity=".65">
    <circle cx="41" cy="57" r="17.5" fill="url(#eyeL)"/>
    <circle cx="79" cy="57" r="17.5" fill="url(#eyeR)"/>
  </g>

  <!-- wings -->
  <ellipse cx="24" cy="78" rx="10" ry="20" fill="#131319"/>
  <ellipse cx="96" cy="78" rx="10" ry="20" fill="#131319"/>
  <path d="M18 64 Q13 78 18 92" fill="none" stroke="#03E1FF" stroke-width="1" opacity=".4" stroke-linecap="round"/>
  <path d="M102 64 Q107 78 102 92" fill="none" stroke="#DC1FFF" stroke-width="1" opacity=".4" stroke-linecap="round"/>

  <!-- ears (solid tufts above the head) -->
  <path d="M28 40 Q24 16 44 27 L46 34 Q36 34 30 44 Z" fill="#17171E"/>
  <path d="M92 40 Q96 16 76 27 L74 34 Q84 34 90 44 Z" fill="#17171E"/>
  <path d="M28 40 Q24 16 44 27" fill="none" stroke="#03E1FF" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>
  <path d="M92 40 Q96 16 76 27" fill="none" stroke="#DC1FFF" stroke-width="1.2" opacity=".55" stroke-linecap="round"/>

  <!-- body -->
  <path d="M60 22 C41 22 27 36 27 55 C24 63 22 72 22 80 C22 101 39 112 60 112 C81 112 98 101 98 80 C98 72 96 63 93 55 C93 36 79 22 60 22 Z" fill="#16161D"/>
  <path d="M60 22 C41 22 27 36 27 55 C24 63 22 72 22 80 C22 101 39 112 60 112 C81 112 98 101 98 80 C98 72 96 63 93 55 C93 36 79 22 60 22 Z"
        fill="none" stroke="url(#rim)" stroke-width="1" opacity=".35"/>

  <!-- eyes -->
  <circle cx="41" cy="57" r="16.5" fill="url(#eyeL)"/>
  <circle cx="79" cy="57" r="16.5" fill="url(#eyeR)"/>
  <circle cx="42.5" cy="58.5" r="10.5" fill="#0B0C11"/>
  <circle cx="77.5" cy="58.5" r="10.5" fill="#0B0C11"/>
  <circle cx="38.5" cy="54" r="3" fill="#FFFFFF"/>
  <circle cx="73.5" cy="54" r="3" fill="#FFFFFF"/>

  <!-- beak -->
  <path d="M60 68 L64.5 73.5 L60 79 L55.5 73.5 Z" fill="#FFA028"/>
</svg>
